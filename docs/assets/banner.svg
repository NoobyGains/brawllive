<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="BrawlLive: in-game online matchmaking for Project+">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <circle cx="1020" cy="70" r="140" fill="url(#glow)"/>
  <circle cx="160" cy="280" r="120" fill="url(#glow)"/>
  <g opacity="0.9">
    <circle cx="930" cy="200" r="34" fill="#22d3ee"/>
    <circle cx="1010" cy="150" r="22" fill="#a3e635"/>
    <circle cx="1080" cy="230" r="28" fill="#fb7185"/>
    <circle cx="1130" cy="120" r="16" fill="#fde68a"/>
    <path d="M930 200 L1010 150 L1080 230 L1130 120" stroke="#ffffff" stroke-opacity="0.6" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
  <text x="80" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="96" font-weight="800" fill="url(#title)" letter-spacing="-2">BrawlLive</text>
  <text x="84" y="205" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#f5f3ff">In-game online matchmaking for Project+</text>
  <text x="84" y="248" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#ddd6fe">Launch · hold L+R+Start · play. No codes, no Discord, no sign-up.</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700">
    <rect x="84" y="270" width="150" height="30" rx="15" fill="#22d3ee"/>
    <text x="159" y="291" text-anchor="middle" fill="#0f172a">Project+ 3.2</text>
    <rect x="246" y="270" width="150" height="30" rx="15" fill="#a3e635"/>
    <text x="321" y="291" text-anchor="middle" fill="#0f172a">Dolphin 2606</text>
    <rect x="408" y="270" width="190" height="30" rx="15" fill="#fde68a"/>
    <text x="503" y="291" text-anchor="middle" fill="#0f172a">Stock-compatible netplay</text>
  </g>
